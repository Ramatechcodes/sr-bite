<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SR Bites Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f6fa;
}

header{
background:#111;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:24px;
font-weight:700;
color:#ff6b00;
}

.container{
padding:25px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
color:#777;
margin-bottom:10px;
}

.card h1{
color:#ff6b00;
}

.search-box{
margin-bottom:20px;
}

.search-box input{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:8px;
}

.table-container{
overflow-x:auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#ff6b00;
color:white;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

select{
padding:8px;
border-radius:5px;
}

.map-btn{
background:#28a745;
color:white;
padding:8px 12px;
text-decoration:none;
border-radius:5px;
}

@media(max-width:768px){

.cards{
grid-template-columns:1fr;
}

}

</style>

</head>
<body>

<header>

<div class="logo">
SR BITES ADMIN
</div>

</header>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Orders</h3>
<h1 id="totalOrders">0</h1>
</div>

<div class="card">
<h3>Pending Orders</h3>
<h1 id="pendingOrders">0</h1>
</div>

<div class="card">
<h3>Delivered Orders</h3>
<h1 id="deliveredOrders">0</h1>
</div>

<div class="card">
<h3>Total Revenue</h3>
<h1 id="totalRevenue">₦0</h1>
</div>

</div>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search customer, phone or food..."
onkeyup="searchOrders()">

</div>

<div class="table-container">

<table>

<thead>

<tr>
<th>Tracking ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Address</th>
<th>Food</th>
<th>Qty</th>
<th>Amount</th>
<th>Status</th>
<th>Map</th>
</tr>

</thead>

<tbody id="ordersTable">

</tbody>

</table>

</div>

</div>

<script>

let allOrders = [];

/* LOAD DASHBOARD STATS */

async function loadStats(){

try{

const res =
await fetch("/dashboard-stats");

const data =
await res.json();

document
.getElementById("totalOrders")
.innerText =
data.totalOrders;

document
.getElementById("pendingOrders")
.innerText =
data.pendingOrders;

document
.getElementById("deliveredOrders")
.innerText =
data.deliveredOrders;

document
.getElementById("totalRevenue")
.innerText =
"₦" +
data.totalRevenue
.toLocaleString();

}catch(err){

console.log(err);

}

}

/* LOAD ORDERS */

async function loadOrders(){

try{

const res =
await fetch("/orders");

const orders =
await res.json();

allOrders = orders;

displayOrders(orders);

}catch(err){

console.log(err);

}

}

/* DISPLAY ORDERS */

function displayOrders(orders){

let html = "";

orders.forEach(order=>{

html += `

<tr>
<td>
<b style="color:#ff6b00">
${order.trackingId || "-"}
</b>
</td>
<td>${order.customerName || ""}</td>

<td>${order.email || ""}</td>

<td>${order.phone || ""}</td>

<td>${order.address || ""}</td>

<td>${order.item || ""}</td>

<td>${order.quantity || 0}</td>

<td>₦${order.amount || 0}</td>

<td>

<select
onchange="updateStatus(
'${order._id}',
this.value
)">

<option
value="Pending"
${order.status==="Pending"?"selected":""}>
Pending
</option>

<option
value="Preparing"
${order.status==="Preparing"?"selected":""}>
Preparing
</option>

<option
value="Delivered"
${order.status==="Delivered"?"selected":""}>
Delivered
</option>

</select>

</td>

<td>

<a
class="map-btn"
target="_blank"
href="${order.locationLink || '#'}">

Open Map

</a>

</td>

</tr>

`;

});

document
.getElementById(
"ordersTable"
)
.innerHTML = html;

}

/* UPDATE STATUS */

async function updateStatus(id,status){

try{

await fetch(
`/orders/${id}/status`,
{

method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
status
})

}

);

loadStats();

}catch(err){

console.log(err);

}

}

/* SEARCH */

function searchOrders(){

const value =
document
.getElementById(
"searchInput"
)
.value
.toLowerCase();

const filtered =
allOrders.filter(order =>

(order.customerName || "")
.toLowerCase()
.includes(value)

||

(order.phone || "")
.toLowerCase()
.includes(value)

||

(order.item || "")
.toLowerCase()
.includes(value)
||
(order.trackingId || "")
.toLowerCase()
.includes(value)

);

displayOrders(filtered);

}

/* INIT */

loadStats();
loadOrders();

setInterval(()=>{

loadStats();
loadOrders();

},10000);

</script>

</body>
</html>
